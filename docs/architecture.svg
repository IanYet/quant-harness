<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title description">
<title id="title">量化交易 Harness 架构图</title>
<desc id="description">单机 Bun 和 TypeScript 架构。人和 Agent 编写普通脚本，临时直接运行，或交给常驻 harnessd 管理。每个独立脚本通过进程内的 SDK 调用本机 HTTP 工具，主 ticker 通过 NDJSON 实时流触发脚本。常驻服务连接交易所公共行情、历史数据、交易与私有成交回报，跟踪订单仓位，也提供 SQLite 持久化、通知、健康检查以及 Agent connector。采集脚本可以直接访问外部数据源。</desc>
