<marker id="link" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#506878"/></marker>
<marker id="link-start" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="0.4" refY="5" orient="auto"><path d="M9,1 L0,5 L9,9 Z" fill="#506878"/></marker>
<marker id="store" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8.6" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#738693"/></marker>
